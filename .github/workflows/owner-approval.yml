name: Owner approval

# Approves pull requests the repository owner opens, so the required review gates other contributors only.
# Runs from the base branch and never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  approve:
    if: github.event.pull_request.user.login == github.repository_owner && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Approve
        run: gh pr review "$PR" --approve --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
