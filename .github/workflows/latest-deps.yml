name: Latest dependencies

# Resolves dependencies ignoring uv.lock: every one to its newest release, so a
# breaking upstream release shows up, and direct ones to their declared floors,
# so a floor the code no longer works with shows up. Informational, not a
# required check.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/workflows/latest-deps.yml]

permissions:
  contents: read

jobs:
  test-latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install newest dependencies
        run: uv sync --upgrade --python 3.12

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run pytest

  test-lowest-direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lowest direct dependencies
        run: uv sync --resolution lowest-direct --python ${{ matrix.python-version }}

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync pytest
