name: Docs site

# Builds the site on pull requests that change it, since branch deployments are turned off.
on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "examples/**"
      - "vercel.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
