[project]
name = "cyclops-ai"
version = "0.3.0"
description = "Core agent framework with MCP toolkit support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gopalji Gaur", email = "gopaljigaur@gmail.com"}
]
keywords = ["ai", "agents", "llm", "mcp", "litellm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.102.0",
    "pydantic>=2.12.4",
    "mcp>=2.0.0,<3",
    "anyio>=4.9",
    "httpx2>=2.5.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "docstring-parser>=0.18.0",
    "pyyaml>=6.0.3",
    "exceptiongroup>=1.0.2; python_version < '3.11'",
    "async-timeout>=4.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/gopaljigaur/cyclops"
Repository = "https://github.com/gopaljigaur/cyclops"
Issues = "https://github.com/gopaljigaur/cyclops/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."cyclops.toolkits"]

[tool.hatch.build.targets.wheel]
packages = ["cyclops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not soak'"
markers = ["soak: many runs checking for leaks; run with -m soak"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "black>=26.3.1",
    "ruff>=0.14.4",
    "mypy>=1.18.2",
    "pre-commit>=4.4.0",
    "types-pyyaml>=6.0.12",
    "pytest-xdist>=3.8.0",
]
